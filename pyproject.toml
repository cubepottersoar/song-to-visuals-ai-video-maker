[project]
name = "song-to-visuals-ai-video-maker"
version = "0.4.2"
description = "AI music video generator: turn a song into synced visuals."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "song-to-visuals contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10.1",
    "soundfile>=0.12",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = ["torch>=2.2", "diffusers>=0.27", "accelerate>=0.28"]
cpu = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
s2v = "song_to_visuals.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/song_to_visuals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true